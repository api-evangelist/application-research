naftiko: 1.0.0-alpha2
info:
  label: Application Research Radius API — Messaging
  description: 'Application Research Radius API — Messaging. 1 operations. Lead operation: Application Research Get RabbitMQ
    queue. Self-contained Naftiko capability covering one Application Research business surface.'
  tags:
  - Application Research
  - Messaging
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPLICATION_RESEARCH_API_KEY: APPLICATION_RESEARCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: radius-messaging
    baseUri: https://management.radapp.io
    description: Application Research Radius API — Messaging business capability. Self-contained, no shared references.
    resources:
    - name: planes-radius-planeName-resourceGroups-resourceGroupName-providers-Applications.
      path: /planes/radius/{planeName}/resourceGroups/{resourceGroupName}/providers/Applications.Messaging/rabbitMQQueues/{rabbitMQQueueName}
      operations:
      - name: rabbitmqqueuesget
        method: GET
        description: Application Research Get RabbitMQ queue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: radius-messaging-rest
    port: 8080
    description: REST adapter for Application Research Radius API — Messaging. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/planes/radius/{planename}/resourcegroups/{resourcegroupname}/providers/applications-messaging/rabbitmqqueues/{rabbitmqqueuename}
      name: planes-radius-planename-resourcegroups-resourcegroupname-providers-applications
      description: REST surface for planes-radius-planeName-resourceGroups-resourceGroupName-providers-Applications..
      operations:
      - method: GET
        name: rabbitmqqueuesget
        description: Application Research Get RabbitMQ queue
        call: radius-messaging.rabbitmqqueuesget
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: radius-messaging-mcp
    port: 9090
    transport: http
    description: MCP adapter for Application Research Radius API — Messaging. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: application-research-get-rabbitmq-queue
      description: Application Research Get RabbitMQ queue
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: radius-messaging.rabbitmqqueuesget
      outputParameters:
      - type: object
        mapping: $.
