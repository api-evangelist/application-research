naftiko: 1.0.0-alpha2
info:
  label: Application Research Open Resource Discovery (ORD) API — Integration Dependencies
  description: 'Application Research Open Resource Discovery (ORD) API — Integration Dependencies. 2 operations. Lead operation:
    Application Research List all Integration Dependencies. Self-contained Naftiko capability covering one Application Research
    business surface.'
  tags:
  - Application Research
  - Integration Dependencies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPLICATION_RESEARCH_API_KEY: APPLICATION_RESEARCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: open-resource-discovery-integration-dependencies
    baseUri: https://api.example.com/ord/v1
    description: Application Research Open Resource Discovery (ORD) API — Integration Dependencies business capability. Self-contained,
      no shared references.
    resources:
    - name: integration-dependencies
      path: /integration-dependencies
      operations:
      - name: listintegrationdependencies
        method: GET
        description: Application Research List all Integration Dependencies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: integration-dependencies-ordId
      path: /integration-dependencies/{ordId}
      operations:
      - name: getintegrationdependency
        method: GET
        description: Application Research Get an Integration Dependency by ORD ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.APPLICATION_RESEARCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: open-resource-discovery-integration-dependencies-rest
    port: 8080
    description: REST adapter for Application Research Open Resource Discovery (ORD) API — Integration Dependencies. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/integration-dependencies
      name: integration-dependencies
      description: REST surface for integration-dependencies.
      operations:
      - method: GET
        name: listintegrationdependencies
        description: Application Research List all Integration Dependencies
        call: open-resource-discovery-integration-dependencies.listintegrationdependencies
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/integration-dependencies/{ordid}
      name: integration-dependencies-ordid
      description: REST surface for integration-dependencies-ordId.
      operations:
      - method: GET
        name: getintegrationdependency
        description: Application Research Get an Integration Dependency by ORD ID
        call: open-resource-discovery-integration-dependencies.getintegrationdependency
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: open-resource-discovery-integration-dependencies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Application Research Open Resource Discovery (ORD) API — Integration Dependencies. One tool
      per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: application-research-list-all-integration
      description: Application Research List all Integration Dependencies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-integration-dependencies.listintegrationdependencies
      outputParameters:
      - type: object
        mapping: $.
    - name: application-research-get-integration-dependency
      description: Application Research Get an Integration Dependency by ORD ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-integration-dependencies.getintegrationdependency
      outputParameters:
      - type: object
        mapping: $.
