    resources:
    - name: documents
      path: /documents
      operations:
      - name: listorddocuments
        method: GET
        description: Application Research List all ORD Documents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createorddocument
