    port: 8080
    description: REST adapter for Application Research Open Resource Discovery (ORD) API — ORD Documents. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/documents
      name: documents
      description: REST surface for documents.
      operations:
      - method: GET
        name: listorddocuments
        description: Application Research List all ORD Documents
        call: open-resource-discovery-ord-documents.listorddocuments
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
