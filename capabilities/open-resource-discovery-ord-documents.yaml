naftiko: 1.0.0-alpha2
info:
  label: Application Research Open Resource Discovery (ORD) API — ORD Documents
  description: 'Application Research Open Resource Discovery (ORD) API — ORD Documents. 5 operations. Lead operation: Application
    Research List all ORD Documents. Self-contained Naftiko capability covering one Application Research business surface.'
  tags:
