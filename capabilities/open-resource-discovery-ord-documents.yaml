      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-ord-documents.getorddocument
      outputParameters:
      - type: object
        mapping: $.
    - name: application-research-update-ord-document
      description: Application Research Update an ORD Document
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: open-resource-discovery-ord-documents.updateorddocument
