naftiko: 1.0.0-alpha2
info:
  label: Application Research Open Resource Discovery (ORD) API — Products
  description: 'Application Research Open Resource Discovery (ORD) API — Products. 2 operations. Lead operation: Application
    Research List all Products. Self-contained Naftiko capability covering one Application Research business surface.'
  tags:
  - Application Research
  - Products
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPLICATION_RESEARCH_API_KEY: APPLICATION_RESEARCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: open-resource-discovery-products
    baseUri: https://api.example.com/ord/v1
    description: Application Research Open Resource Discovery (ORD) API — Products business capability. Self-contained, no
      shared references.
    resources:
    - name: products
      path: /products
      operations:
      - name: listproducts
        method: GET
        description: Application Research List all Products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: products-ordId
      path: /products/{ordId}
      operations:
      - name: getproduct
        method: GET
        description: Application Research Get a Product by ORD ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.APPLICATION_RESEARCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: open-resource-discovery-products-rest
    port: 8080
    description: REST adapter for Application Research Open Resource Discovery (ORD) API — Products. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/products
      name: products
      description: REST surface for products.
      operations:
      - method: GET
        name: listproducts
        description: Application Research List all Products
        call: open-resource-discovery-products.listproducts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/products/{ordid}
      name: products-ordid
      description: REST surface for products-ordId.
      operations:
      - method: GET
        name: getproduct
        description: Application Research Get a Product by ORD ID
        call: open-resource-discovery-products.getproduct
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: open-resource-discovery-products-mcp
    port: 9090
    transport: http
    description: MCP adapter for Application Research Open Resource Discovery (ORD) API — Products. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: application-research-list-all-products
      description: Application Research List all Products
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-products.listproducts
      outputParameters:
      - type: object
        mapping: $.
    - name: application-research-get-product-ord
      description: Application Research Get a Product by ORD ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-products.getproduct
      outputParameters:
      - type: object
        mapping: $.
