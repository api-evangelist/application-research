    resources:
    - name: bundles
      path: /bundles
      operations:
      - name: listbundles
        method: GET
        description: Application Research List all bundles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: keyword
          in: query
          type: string
          description: Filter bundles by keyword
      - name: createbundle
        method: POST
        description: Application Research Create a new bundle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
