naftiko: 1.0.0-alpha2
info:
  label: Application Research Open Resource Discovery (ORD) API — Capabilities
  description: 'Application Research Open Resource Discovery (ORD) API — Capabilities. 2 operations. Lead operation: Application
    Research List all Capabilities. Self-contained Naftiko capability covering one Application Research business surface.'
  tags:
  - Application Research
  - Capabilities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPLICATION_RESEARCH_API_KEY: APPLICATION_RESEARCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: open-resource-discovery-capabilities
    baseUri: https://api.example.com/ord/v1
    description: Application Research Open Resource Discovery (ORD) API — Capabilities business capability. Self-contained,
      no shared references.
    resources:
    - name: capabilities
      path: /capabilities
      operations:
      - name: listcapabilities
        method: GET
        description: Application Research List all Capabilities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: capabilities-ordId
      path: /capabilities/{ordId}
      operations:
      - name: getcapability
        method: GET
        description: Application Research Get a Capability by ORD ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.APPLICATION_RESEARCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: open-resource-discovery-capabilities-rest
    port: 8080
    description: REST adapter for Application Research Open Resource Discovery (ORD) API — Capabilities. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/capabilities
      name: capabilities
      description: REST surface for capabilities.
      operations:
      - method: GET
        name: listcapabilities
        description: Application Research List all Capabilities
        call: open-resource-discovery-capabilities.listcapabilities
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/capabilities/{ordid}
      name: capabilities-ordid
      description: REST surface for capabilities-ordId.
      operations:
      - method: GET
        name: getcapability
        description: Application Research Get a Capability by ORD ID
        call: open-resource-discovery-capabilities.getcapability
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: open-resource-discovery-capabilities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Application Research Open Resource Discovery (ORD) API — Capabilities. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: application-research-list-all-capabilities
      description: Application Research List all Capabilities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-capabilities.listcapabilities
      outputParameters:
      - type: object
        mapping: $.
    - name: application-research-get-capability-ord
      description: Application Research Get a Capability by ORD ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-capabilities.getcapability
      outputParameters:
      - type: object
        mapping: $.
