      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: application-research.listclaims
      with:
        installation: tools.installation
        action: tools.action
      inputParameters:
      - name: installation
        type: string
        description: Filter by installation name
      - name: action
        type: string
        description: Filter by action type
      outputParameters:
      - type: object
        mapping: $.
    - name: createclaim
      description: Application Research Create a new claim
      hints:
        readOnly: false
        destructive: false
        idempotent: false
