naftiko: 1.0.0-alpha2
info:
  label: Application Research CNAB Bundle API
  description: API for managing Cloud Native Application Bundles (CNAB). This API provides endpoints for managing CNAB bundles,
    claims, claim results, dependencies, parameter sources, relocation mappings, and installation status.
  tags:
  - Application
  - Research
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: application-research
    baseUri: https://api.example.com/v1
    description: Application Research CNAB Bundle API HTTP API.
    authentication:
      type: bearer
      token: '{{APPLICATION_RESEARCH_TOKEN}}'
    resources:
    - name: bundles
      path: /bundles
      operations:
      - name: listbundles
        method: GET
        description: Application Research List all bundles
        inputParameters:
        - name: keyword
          in: query
          type: string
          description: Filter bundles by keyword
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createbundle
        method: POST
        description: Application Research Create a new bundle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: bundles-name
      path: /bundles/{name}
      operations:
      - name: getbundle
        method: GET
        description: Application Research Get a bundle by name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatebundle
        method: PUT
        description: Application Research Update an existing bundle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletebundle
        method: DELETE
        description: Application Research Delete a bundle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: bundles-name-actions-action
      path: /bundles/{name}/actions/{action}
      operations:
      - name: executebundleaction
        method: POST
        description: Application Research Execute a bundle action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims
      path: /claims
      operations:
      - name: listclaims
        method: GET
        description: Application Research List all claims
        inputParameters:
        - name: installation
          in: query
          type: string
          description: Filter by installation name
        - name: action
          in: query
          type: string
          description: Filter by action type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createclaim
        method: POST
        description: Application Research Create a new claim
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims-id
      path: /claims/{id}
      operations:
      - name: getclaim
        method: GET
        description: Application Research Get a claim by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims-id-results
      path: /claims/{id}/results
      operations:
      - name: listclaimresults
        method: GET
        description: Application Research List results for a claim
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: results-id
      path: /results/{id}
      operations:
      - name: getclaimresult
        method: GET
        description: Application Research Get a claim result by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: installations
      path: /installations
      operations:
      - name: listinstallations
        method: GET
        description: Application Research List all installations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: installations-name-status
      path: /installations/{name}/status
      operations:
      - name: getinstallationstatus
        method: GET
        description: Application Research Get installation status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: application-research-rest
    description: REST adapter for Application Research CNAB Bundle API.
    resources:
    - path: /bundles
      name: listbundles
      operations:
      - method: GET
        name: listbundles
        description: Application Research List all bundles
        call: application-research.listbundles
        outputParameters:
        - type: object
          mapping: $.
    - path: /bundles
      name: createbundle
      operations:
      - method: POST
        name: createbundle
        description: Application Research Create a new bundle
        call: application-research.createbundle
        outputParameters:
        - type: object
          mapping: $.
    - path: /bundles/{name}
      name: getbundle
      operations:
      - method: GET
        name: getbundle
        description: Application Research Get a bundle by name
        call: application-research.getbundle
        outputParameters:
        - type: object
          mapping: $.
    - path: /bundles/{name}
      name: updatebundle
      operations:
      - method: PUT
        name: updatebundle
        description: Application Research Update an existing bundle
        call: application-research.updatebundle
        outputParameters:
        - type: object
          mapping: $.
    - path: /bundles/{name}
      name: deletebundle
      operations:
      - method: DELETE
        name: deletebundle
        description: Application Research Delete a bundle
        call: application-research.deletebundle
        outputParameters:
        - type: object
          mapping: $.
    - path: /bundles/{name}/actions/{action}
      name: executebundleaction
      operations:
      - method: POST
        name: executebundleaction
        description: Application Research Execute a bundle action
        call: application-research.executebundleaction
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims
      name: listclaims
      operations:
      - method: GET
        name: listclaims
        description: Application Research List all claims
        call: application-research.listclaims
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims
      name: createclaim
      operations:
      - method: POST
        name: createclaim
        description: Application Research Create a new claim
        call: application-research.createclaim
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims/{id}
      name: getclaim
      operations:
      - method: GET
        name: getclaim
        description: Application Research Get a claim by ID
        call: application-research.getclaim
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims/{id}/results
      name: listclaimresults
      operations:
      - method: GET
        name: listclaimresults
        description: Application Research List results for a claim
        call: application-research.listclaimresults
        outputParameters:
        - type: object
          mapping: $.
    - path: /results/{id}
      name: getclaimresult
      operations:
      - method: GET
        name: getclaimresult
        description: Application Research Get a claim result by ID
        call: application-research.getclaimresult
        outputParameters:
        - type: object
          mapping: $.
    - path: /installations
      name: listinstallations
      operations:
      - method: GET
        name: listinstallations
        description: Application Research List all installations
        call: application-research.listinstallations
        outputParameters:
        - type: object
          mapping: $.
    - path: /installations/{name}/status
      name: getinstallationstatus
      operations:
      - method: GET
        name: getinstallationstatus
        description: Application Research Get installation status
        call: application-research.getinstallationstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: application-research-mcp
    transport: http
    description: MCP adapter for Application Research CNAB Bundle API for AI agent use.
    tools:
