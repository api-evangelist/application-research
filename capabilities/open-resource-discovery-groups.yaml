      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-groups.listgroups
      outputParameters:
      - type: object
        mapping: $.
    - name: application-research-get-group-group
      description: Application Research Get a Group by Group ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-resource-discovery-groups.getgroup
      outputParameters:
      - type: object
        mapping: $.
