description: Application Research is an index of five open-source specifications (Score, Cloud Native
  Application Bundle / CNAB, Open Component Model / OCM, Open Resource Discovery / ORD, Radius) for declaring
  application service-integration dependencies. None of these specifications charge license fees; all
  are governed by their respective open-source foundations or sponsoring vendors (CNCF, Linux Foundation,
  SAP, Microsoft) and released under permissive licenses. The base URLs in apis.yml are illustrative and
  do not represent commercial endpoints.
notes: This is a research-index collection of free OSS specs; there is no commercial pricing to reconcile.
