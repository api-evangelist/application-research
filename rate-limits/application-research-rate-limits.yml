specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Application Research
providerId: application-research
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Rate Limiting
  - Open Source
  - Specifications
  - Cloud Native
description: The Application Research index aggregates five open-source workload/component/discovery specifications
  (Score, CNAB, OCM, ORD, Radius). These are specifications and OSS toolchains rather than hosted commercial
  APIs; the base URLs in apis.yml are illustrative. There is no central rate-limited endpoint to govern.
  When deployed against a self-hosted CLI or platform integration, throughput is bounded by the consuming
  platform's capacity (Kubernetes API server, Helm, ArgoCD, Backstage, Terraform).
notes: No public hosted APIs exist for these specs; rate limits do not apply.
sources:
  - https://score.dev
  - https://cnab.io
  - https://ocm.software
  - https://sap.github.io/open-resource-discovery/
  - https://radapp.io
responseCodes: {}
limits:
  - name: Specification toolchain throughput
    scope: self-hosted
    metric: varies
    limit: bounded by consuming platform
    notes: Score / CNAB / OCM / ORD / Radius are CLIs and SDKs; rate is bounded by the underlying Kubernetes
      / Helm / Terraform / Backstage runtime, not by any hosted API.
policies:
  - name: Self-Hosted Capacity Planning
    description: Rate-limit considerations are inherited from the platform consuming the specification
      (Kubernetes API server, Helm registry, ArgoCD controller, Backstage), not from the specification
      authors themselves.
  - name: Registry Etiquette
    description: When pulling CNAB bundles or OCM components from public registries (GitHub Container
      Registry, Docker Hub, etc.), respect those registries' published rate limits.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
