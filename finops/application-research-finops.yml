meters:
  - name: workload_deployments
    description: Workload deployments produced from Score / CNAB / Radius specs (telemetry for downstream
      cost attribution)
    unit: deployment
    aggregation: sum
    dimensions:
      - spec
      - target_platform
      - environment
  - name: component_artifacts
    description: OCM components/artifacts moved through the supply chain
    unit: artifact
    aggregation: sum
    dimensions:
      - registry
      - environment
  - name: discovery_documents
    description: ORD discovery documents published or consumed
    unit: document
    aggregation: sum
    dimensions:
      - publisher
principles:
  - name: Visibility
    description: Use the underlying platform's billing exports (cloud, container registry, Backstage)
      to attribute spend driven by applying these specifications; specs themselves emit no billing.
  - name: Allocation
    description: Tag specs and bundles with team / cost-center metadata so downstream cloud consumption
      can be allocated back to the application owner.
  - name: Optimization
    description: Use Score / Radius portability to right-size targets per environment (smaller compute
      for non-prod), share OCM components across applications, prefer ORD-driven service catalogs to reduce
      duplicate API onboarding cost.
  - name: Accountability
    description: Platform Engineering owns the spec choice and toolchain; application teams accountable
      for cloud/runtime cost attributed back via labels propagated from the specification.
