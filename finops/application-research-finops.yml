description: 'FOCUS-aligned FinOps view for Application Research: this is a research index of five free
  OSS specifications (Score, CNAB, OCM, ORD, Radius). There is no direct billing relationship; FinOps
  cost surfaces are downstream — the cloud, registry, and platform spend driven by applying these specifications
  in production.'
sources:
