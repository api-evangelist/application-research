aid: application-research
name: Application Research
description: >-
  Application Research is a topic collection focused on specifications for declaring application service integration
  dependencies. It covers five specification formats: Score (platform-agnostic workload specs), Cloud Native Application
  Bundle (CNAB), Open Component Model (OCM), Open Resource Discovery (ORD), and Radius — all aimed at enabling
  deployment teams to understand what services (APIs, databases, caches, message buses, blob stores) an application
  requires.
type: Index
deliveryModel:
  model: unknown
  open_source: false
  commercial: false
  callable_host: false
  label: Delivery model not determined — needs a product licence on record
  confidence: low
  source:
  - openapi
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: free
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Free · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/application-research.png
tags:
  - Application Dependencies
  - Cloud-Native
  - Integration
  - Research
  - Specifications
  - Workload Specifications
tags_raw:
  - Application Dependencies
  - Cloud Native
  - Integration
  - Research
  - Specifications
  - Workload Specifications
url: https://raw.githubusercontent.com/api-evangelist/application-research/refs/heads/main/apis.yml
