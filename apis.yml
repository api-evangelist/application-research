aid: application-research
name: Application Research
description: >-
  Application Research is a research initiative focused on creating a
  project-agnostic specification for declaring a service's integration
  dependencies, allowing application deployment teams to understand what other
  services (APIs, databases, caches, blob stores, message buses, etc.) must be
  available for an application to run successfully.
