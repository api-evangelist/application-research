openapi: 3.2.0
info:
  title: Application Research Radius Planes API
  description: "OpenAPI 3.1 specification for Radius - a cloud-native application platform that enables \ndevelopers to define, deploy, and collaborate on cloud-native applications across public \nclouds and private infrastructure.\n"
  version: 2023-10-01-preview
  contact:
    name: Radius Project
    url: https://radapp.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://management.radapp.io
  description: Radius Management API
- url: http://localhost:8080
  description: Local Development
tags:
- name: Planes
  description: Plane management operations
paths:
  /planes/radius/{planeName}:
    get:
      tags:
      - Planes
      summary: Application Research Get Radius plane
      operationId: RadiusPlanes_Get
      parameters:
      - $ref: '#/components/parameters/PlaneNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadiusPlaneResource'
              examples:
                radiusPlane:
                  $ref: '#/components/examples/RadiusPlaneExample'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    description: Error code
                  message:
                    type: string
                    description: Error message
                  target:
                    type: string
                    description: Error target
                required:
                - code
                - message
            required:
            - error
  schemas:
    ProvisioningState:
      type: string
      description: Provisioning state of the resource at the time the operation was called
      enum:
      - Creating
      - Updating
      - Deleting
      - Accepted
      - Provisioning
      - Succeeded
      - Failed
      - Canceled
      readOnly: true
    RadiusPlaneResource:
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/RadiusPlaneResourceProperties'
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        systemData:
          type: object
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
        location:
          type: string
      required:
      - properties
      - location
    RadiusPlaneResourceProperties:
      type: object
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          readOnly: true
        resourceProviders:
          type: object
          additionalProperties:
            type: string
      required:
      - resourceProviders
  examples:
    RadiusPlaneExample:
      summary: Radius plane with resource providers
      value:
        properties:
          resourceProviders:
            Applications.Core: http://applications-rp.radius-system:8080
            Applications.Dapr: http://applications-rp.radius-system:8080
            Applications.Datastores: http://applications-rp.radius-system:8080
            Applications.Messaging: http://applications-rp.radius-system:8080
        location: global
        tags:
          plane: radius
  parameters:
    PlaneNameParameter:
      name: planeName
      in: path
      required: true
      description: The name of the plane
      schema:
        type: string
        pattern: ^[A-Za-z]([-A-Za-z0-9]*[A-Za-z0-9])?$
        maxLength: 63
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to use for this operation
      schema:
        type: string
        default: 2023-10-01-preview
