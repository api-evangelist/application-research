openapi: 3.1.0
info:
  title: Application Research CNAB Bundle API Resources Dapr API
  version: 1.0.0
  description: 'API for managing Cloud Native Application Bundles (CNAB).


    This API provides endpoints for managing CNAB bundles, claims, claim results,

    dependencies, parameter sources, relocation mappings, and installation status.

    '
  contact:
    name: CNAB Specification
    url: https://cnab.io
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://api.example.com/v1
  description: Production server
- url: https://staging-api.example.com/v1
  description: Staging server
security:
- bearerAuth: []
- apiKey: []
tags:
- name: Dapr
  description: Dapr component operations
paths:
  /planes/radius/{planeName}/resourceGroups/{resourceGroupName}/providers/Applications.Dapr/stateStores/{stateStoreName}:
    get:
      tags:
      - Dapr
      summary: Application Research Get Dapr state store
      operationId: DaprStateStores_Get
      parameters:
      - $ref: '#/components/parameters/PlaneNameParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/StateStoreNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaprStateStoreResource'
              examples:
                redisStateStore:
                  $ref: '#/components/examples/RedisStateStoreExample'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /planes/radius/{planeName}/resourceGroups/{resourceGroupName}/providers/Applications.Dapr/pubSubBrokers/{pubSubBrokerName}:
    get:
      tags:
      - Dapr
      summary: Application Research Get Dapr pub/sub broker
      operationId: DaprPubSubBrokers_Get
      parameters:
      - $ref: '#/components/parameters/PlaneNameParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/PubSubBrokerNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaprPubSubBrokerResource'
              examples:
                rabbitMQPubSub:
                  $ref: '#/components/examples/RabbitMQPubSubExample'
        default:
          $ref: '#/components/responses/ErrorResponse'
  ? /planes/radius/{planeName}/resourceGroups/{resourceGroupName}/providers/Applications.Dapr/secretStores/{daprSecretStoreName}
  : get:
      tags:
      - Dapr
      summary: Application Research Get Dapr secret store
      operationId: DaprSecretStores_Get
      parameters:
      - $ref: '#/components/parameters/PlaneNameParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/DaprSecretStoreNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaprSecretStoreResource'
              examples:
                keyVaultSecretStore:
                  $ref: '#/components/examples/KeyVaultSecretStoreExample'
        default:
          $ref: '#/components/responses/ErrorResponse'
  ? /planes/radius/{planeName}/resourceGroups/{resourceGroupName}/providers/Applications.Dapr/configurationStores/{configurationStoreName}
  : get:
      tags:
      - Dapr
      summary: Application Research Get Dapr configuration store
      operationId: DaprConfigurationStores_Get
      parameters:
      - $ref: '#/components/parameters/PlaneNameParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ConfigurationStoreNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaprConfigurationStoreResource'
              examples:
                appConfigStore:
                  $ref: '#/components/examples/AppConfigConfigurationStoreExample'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  parameters:
    PubSubBrokerNameParameter:
      name: pubSubBrokerName
      in: path
      required: true
      description: The name of the Dapr pub/sub broker
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to use for this operation
      schema:
        type: string
        default: 2023-10-01-preview
    ConfigurationStoreNameParameter:
      name: configurationStoreName
      in: path
      required: true
      description: The name of the Dapr configuration store
      schema:
        type: string
    PlaneNameParameter:
      name: planeName
      in: path
      required: true
      description: The name of the plane
      schema:
        type: string
        pattern: ^[A-Za-z]([-A-Za-z0-9]*[A-Za-z0-9])?$
        maxLength: 63
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group
      schema:
        type: string
        pattern: ^[A-Za-z]([-A-Za-z0-9]*[A-Za-z0-9])?$
        maxLength: 63
    StateStoreNameParameter:
      name: stateStoreName
      in: path
      required: true
      description: The name of the Dapr state store
      schema:
        type: string
    DaprSecretStoreNameParameter:
      name: daprSecretStoreName
      in: path
      required: true
      description: The name of the Dapr secret store
      schema:
        type: string
  schemas:
    DaprPubSubBrokerResource:
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/DaprPubSubBrokerProperties'
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        systemData:
          type: object
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
        location:
          type: string
      required:
      - properties
      - location
    EnvironmentCompute:
      type: object
      description: Represents backing compute resource
      properties:
        kind:
          type: string
        resourceId:
          type: string
        identity:
          $ref: '#/components/schemas/IdentitySettings'
      required:
      - kind
      discriminator:
        propertyName: kind
        mapping:
          kubernetes: '#/components/schemas/KubernetesCompute'
          aci: '#/components/schemas/AzureContainerInstanceCompute'
    ProvisioningState:
      type: string
      description: Provisioning state of the resource at the time the operation was called
      enum:
      - Creating
      - Updating
      - Deleting
      - Accepted
      - Provisioning
      - Succeeded
      - Failed
      - Canceled
      readOnly: true
    ResourceReference:
      type: object
      description: Describes a reference to an existing resource
      properties:
        id:
          type: string
          description: Resource id of an existing resource
      required:
      - id
    DaprSecretStoreResource:
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/DaprSecretStoreProperties'
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        systemData:
          type: object
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
        location:
          type: string
      required:
      - properties
      - location
    ResourceProvisioning:
      type: string
      description: Specifies how the underlying service/resource is provisioned and managed
      enum:
      - recipe
      - manual
    ResourceStatus:
      type: object
      description: Status of a resource
      properties:
        compute:
          $ref: '#/components/schemas/EnvironmentCompute'
        recipe:
          $ref: '#/components/schemas/RecipeStatus'
          readOnly: true
        outputResources:
          type: array
          items:
            $ref: '#/components/schemas/OutputResource'
    OutputResource:
      type: object
      description: Properties of an output resource
      properties:
        localId:
          type: string
        id:
          type: string
        radiusManaged:
          type: boolean
    IdentitySettingKind:
      type: string
      description: IdentitySettingKind is the kind of supported external identity setting
      enum:
      - undefined
      - azure.com.workload
      - aws.com.irsa
      - userAssigned
      - systemAssigned
      - systemAssignedUserAssigned
    DaprSecretStoreProperties:
      type: object
      properties:
        environment:
          type: string
        application:
          type: string
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          readOnly: true
        status:
          $ref: '#/components/schemas/ResourceStatus'
          readOnly: true
        componentName:
          type: string
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetadataValue'
        type:
          type: string
        version:
          type: string
        recipe:
          $ref: '#/components/schemas/Recipe'
        resourceProvisioning:
          $ref: '#/components/schemas/ResourceProvisioning'
      required:
      - environment
    IdentitySettings:
      type: object
      description: IdentitySettings is the external identity setting
      properties:
        kind:
          $ref: '#/components/schemas/IdentitySettingKind'
        oidcIssuer:
          type: string
          description: The URI for your compute platform's OIDC issuer
        resource:
          type: string
          description: The resource ID of the provisioned identity
        managedIdentity:
          type: array
          items:
            type: string
      required:
      - kind
    DaprConfigurationStoreProperties:
      type: object
      properties:
        environment:
          type: string
        application:
          type: string
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          readOnly: true
        status:
          $ref: '#/components/schemas/ResourceStatus'
          readOnly: true
        componentName:
          type: string
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetadataValue'
        type:
          type: string
        version:
          type: string
        auth:
          $ref: '#/components/schemas/DaprResourceAuth'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
        recipe:
          $ref: '#/components/schemas/Recipe'
        resourceProvisioning:
          $ref: '#/components/schemas/ResourceProvisioning'
      required:
      - environment
    DaprStateStoreProperties:
      type: object
      properties:
        environment:
          type: string
        application:
          type: string
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          readOnly: true
        status:
          $ref: '#/components/schemas/ResourceStatus'
          readOnly: true
        componentName:
          type: string
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetadataValue'
        type:
          type: string
        version:
          type: string
        auth:
          $ref: '#/components/schemas/DaprResourceAuth'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
        recipe:
          $ref: '#/components/schemas/Recipe'
        resourceProvisioning:
          $ref: '#/components/schemas/ResourceProvisioning'
      required:
      - environment
    DaprPubSubBrokerProperties:
      type: object
      properties:
        environment:
          type: string
        application:
          type: string
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          readOnly: true
        status:
          $ref: '#/components/schemas/ResourceStatus'
          readOnly: true
        componentName:
          type: string
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetadataValue'
        type:
          type: string
        version:
          type: string
        auth:
          $ref: '#/components/schemas/DaprResourceAuth'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
        recipe:
          $ref: '#/components/schemas/Recipe'
        resourceProvisioning:
          $ref: '#/components/schemas/ResourceProvisioning'
      required:
      - environment
    Recipe:
      type: object
      description: The recipe used to automatically deploy underlying infrastructure
      properties:
        name:
          type: string
          description: The name of the recipe within the environment to use
        parameters:
          type: object
          description: Key/value parameters to pass into the recipe at deployment
      required:
      - name
    MetadataValueFromSecret:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
      required:
      - name
      - key
    DaprConfigurationStoreResource:
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/DaprConfigurationStoreProperties'
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        systemData:
          type: object
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
        location:
          type: string
      required:
      - properties
      - location
    DaprStateStoreResource:
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/DaprStateStoreProperties'
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        systemData:
          type: object
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
        location:
          type: string
      required:
      - properties
      - location
    MetadataValue:
      type: object
      properties:
        value:
          type: string
        secretKeyRef:
          $ref: '#/components/schemas/MetadataValueFromSecret'
    RecipeStatus:
      type: object
      description: Recipe status at deployment time
      properties:
        templateKind:
          type: string
        templatePath:
          type: string
        templateVersion:
          type: string
      required:
      - templateKind
      - templatePath
    DaprResourceAuth:
      type: object
      properties:
        secretStore:
          type: string
  examples:
    AppConfigConfigurationStoreExample:
      summary: Azure App Configuration store
      value:
        properties:
          environment: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Core/environments/prod
          application: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Core/applications/ecommerce-platform
          resourceProvisioning: manual
          type: configuration.azure.appconfig
          version: v1
          metadata:
            host:
              value: https://ecommerce-config.azconfig.io
            maxRetries:
              value: '3'
            retryDelay:
              value: 5s
          auth:
            secretStore: order-secrets
        location: eastus
        tags:
          dapr-component: config-store
    KeyVaultSecretStoreExample:
      summary: Azure Key Vault secret store
      value:
        properties:
          environment: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Core/environments/prod
          application: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Core/applications/ecommerce-platform
          resourceProvisioning: manual
          type: secretstores.azure.keyvault
          version: v1
          metadata:
            vaultName:
              value: ecommerce-secrets-kv
            azureClientId:
              value: 00000000-0000-0000-0000-000000000000
        location: eastus
        tags:
          dapr-component: secret-store
    RedisStateStoreExample:
      summary: Redis state store for e-commerce
      value:
        properties:
          environment: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Core/environments/prod
          application: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Core/applications/ecommerce-platform
          resourceProvisioning: manual
          type: state.redis
          version: v1
          metadata:
            redisHost:
              value: ecommerce-redis.redis.cache.windows.net:6380
            redisPassword:
              secretKeyRef:
                name: redis-password
                key: password
            enableTLS:
              value: 'true'
            actorStateStore:
              value: 'true'
          auth:
            secretStore: order-secrets
          resources:
          - id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ecommerce-rg/providers/Microsoft.Cache/redis/ecommerce-redis
        location: eastus
        tags:
          dapr-component: state-store
    RabbitMQPubSubExample:
      summary: RabbitMQ pub/sub for e-commerce
      value:
        properties:
          environment: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Core/environments/prod
          application: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Core/applications/ecommerce-platform
          resourceProvisioning: manual
          type: pubsub.rabbitmq
          version: v1
          metadata:
            host:
              value: amqps://ecommerce-rabbitmq.servicebus.windows.net:5671
            durable:
              value: 'true'
            deletedWhenUnused:
              value: 'false'
            autoAck:
              value: 'false'
          resources:
          - id: /planes/radius/local/resourceGroups/ecommerce-rg/providers/Applications.Messaging/rabbitMQQueues/order-events
        location: eastus
        tags:
          dapr-component: pubsub
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    description: Error code
                  message:
                    type: string
                    description: Error message
                  target:
                    type: string
                    description: Error target
                required:
                - code
                - message
            required:
            - error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT-based authentication
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication
